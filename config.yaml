# Cloudbase configuration
# This file is copied to ~/.cloudbase/config.yaml on first run.
# Edit that file — it will be preserved across Cloudbase updates.

server:
  # Port Cloudbase listens on
  port: 7823


auth:
  # How long a login session (JWT) is valid, in seconds.
  # 3600 = 1 hour, 86400 = 1 day, 604800 = 1 week
  token_expire_seconds: 3600


ports:
  # Host port range assigned to app instances (Docker external ports)
  # Must have at least as many ports as limits.max_instances
  instance_min: 10000
  instance_max: 19999

  # The port a database publishes on its node's node-network address, for apps on other nodes.
  # Each database takes one free port from this range (also set in System settings); only reachable over the node network.
  db_proxy_min: 30000
  db_proxy_max: 30999

  # Public database access on the primary, when enabled per database.
  # Each database with public access takes one free port from this range (also set in System settings);
  # open this range in your firewall if you use it.
  db_public_min: 31000
  db_public_max: 31999

limits:
  # Maximum number of apps that can be deployed
  max_apps: 1000

  # Maximum total number of instances (instances) across all apps and nodes
  max_instances: 10000

  # Maximum number of nodes (primary + remote) that can be registered
  max_nodes: 100

  # Restart-loop protection: max restarts per window per app
  max_restarts_per_window: 5
  restart_window_seconds: 60

tenant:
  # On when the apps and databases belong to people you don't know (a hosting service built on Cloudbase).
  # Then: apps can't reach the local network, every container gets CPU/memory/process limits and no risky
  # capabilities, builds can't reach the server or the local network, mail (port 25) out is blocked, nothing
  # runs on the primary, and the nodes only forward the app and database ports to each other.
  enabled: false
  default_cpu_limit: 1.0
  default_memory_limit_mb: 512
  pids_limit: 512
  # A sandbox runtime for every container, e.g. "runsc" (gVisor: scripts/setup-gvisor.sh on every node)
  runtime: ""
  # The sandbox for databases too: slower, and their users can't run programs on the server anyway
  sandbox_databases: false
  build_timeout_seconds: 1800
  # Disk per container for what it writes outside volumes; needs Docker's overlay2 on xfs mounted with pquota
  container_disk_mb: 0
