<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Cloudbase</title>
  <link rel="icon" type="image/png" href="/cloudbase.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
    }
    .login-mark {
      width: 36px;
      height: 36px;
      margin-bottom: 28px;
      border-radius: 10px;
      background: var(--text);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login h1 {
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .login-host {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 32px;
    }
    .login .field { margin-bottom: 14px; }
    .login .input { height: 38px; }
    .login .btn-primary { width: 100%; height: 38px; margin-top: 8px; }
    .login-error {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--red-bg);
      border: 1px solid var(--red-border);
      color: var(--red);
      font-size: 13px;
    }
    .login-error.visible { display: block; }
    .login-foot { margin-top: 40px; font-size: 12px; color: var(--faint); }
  </style>
</head>
<body>

<main class="login">
  <div class="login-mark" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5z"/></svg>
  </div>
  <h1>Sign in to Cloudbase</h1>
  <div class="login-host" id="login-host"></div>

  <form id="login-form" autocomplete="on">
    <div class="field">
      <label class="field-label" for="username">Username</label>
      <input id="username" class="input" type="text" autocomplete="username" placeholder="admin" required autofocus />
    </div>
    <div class="field">
      <label class="field-label" for="password">Password</label>
      <input id="password" class="input" type="password" autocomplete="current-password" required />
    </div>
    <button class="btn btn-primary" type="submit" id="login-btn">Sign in</button>
    <div class="login-error" id="login-error" role="alert"></div>
  </form>

  <div class="login-foot">Self-hosted deployment panel</div>
</main>

<script>
  const form   = document.getElementById('login-form');
  const btn    = document.getElementById('login-btn');
  const errEl  = document.getElementById('login-error');
  const pwdEl  = document.getElementById('password');
  const userEl = document.getElementById('username');

  document.getElementById('login-host').textContent = location.host;

  function showError(msg) {
    errEl.textContent = msg;
    errEl.classList.add('visible');
  }

  // Only follow ?next= to a path on this server — never to another site.
  function safeNext() {
    const next = new URLSearchParams(location.search).get('next') || '/';
    return next.startsWith('/') && !next.startsWith('//') && !next.startsWith('/\\') ? next : '/';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    errEl.classList.remove('visible');

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ username: userEl.value.trim(), password: pwdEl.value }),
      });

      if (res.ok) {
        location.href = safeNext();
        return;
      }

      if (res.status === 429) {
        showError('Too many attempts. Please wait a minute and try again.');
      } else if (res.status === 401) {
        showError('Invalid username or password.');
        pwdEl.value = '';
        pwdEl.focus();
      } else {
        showError('An unexpected error occurred.');
      }
    } catch {
      showError('Could not reach the server.');
    }

    btn.disabled = false;
    btn.textContent = 'Sign in';
  });
</script>
</body>
</html>
