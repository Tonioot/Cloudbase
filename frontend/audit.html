<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudbase — Audit Logs</title>
  <link rel="icon" type="image/png" href="/cloudbase.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

<div class="shell">

  <aside class="rail" id="rail"></aside>

  <!-- ─── Main ─────────────────────────────────────────────────────────── -->
  <main class="main-content">
    <div class="page">

      <div class="page-title-row">
        <h1>Audit log</h1>
        <span class="page-title-meta">Every action across apps, nodes and users</span>
        <div class="page-title-actions">
          <div class="input-icon-wrap">
            <span class="icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input class="input" id="filter-actor" placeholder="Filter by user" aria-label="Filter by user" style="width:180px" />
          </div>
          <select class="input" id="filter-action" aria-label="Filter by action" style="width:200px">
            <option value="">All actions</option>
          </select>
        </div>
      </div>

      <div id="audit-log-wrap"><div class="apps-empty">Loading…</div></div>
      <div style="text-align:center;padding:24px 0 0">
        <button class="btn" id="btn-load-more" style="display:none">Load more</button>
      </div>

    </div>
  </main>

</div>

<div id="toast-container"></div>

<script type="module">
  import { api } from './js/api.js';
  import { initAuditLogs } from './js/audit.js';
  import { initSidebar } from './js/sidebar.js';

  try {
    await api.checkAuth();
  } catch {
    location.href = '/login';
  }

  await initSidebar();
  initAuditLogs();

</script>
</body>
</html>
