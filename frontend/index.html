<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudbase — Dashboard</title>
  <link rel="icon" type="image/png" href="/cloudbase.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/overview.css" />
</head>
<body>

<div class="shell">

  <aside class="rail" id="rail"></aside>

  <!-- ─── Main ─────────────────────────────────────────────────────────── -->
  <main class="main-content">
    <div class="page">

      <div class="page-title-row">
        <h1>Overview</h1>
        <span class="page-title-meta" id="overview-meta"></span>
        <div class="page-title-actions">
          <button class="btn" id="btn-add-node" data-perm="nodes.add">Add node</button>
          <button class="btn btn-primary" id="btn-deploy" data-perm="apps.deploy">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New app
          </button>
        </div>
      </div>

      <!-- Key numbers -->
      <section class="kpis stat-strip" aria-label="Key metrics">
        <div class="kpi" id="kpi-apps"><span class="kpi-label">Apps running</span><span class="kpi-value"><strong>—</strong><span></span></span><svg class="kpi-spark" viewBox="0 0 96 18" aria-hidden="true"><polyline points=""/></svg></div>
        <div class="kpi" id="kpi-instances"><span class="kpi-label">Instances</span><span class="kpi-value"><strong>—</strong><span>running</span></span><svg class="kpi-spark" viewBox="0 0 96 18" aria-hidden="true"><polyline points=""/></svg></div>
        <div class="kpi" id="kpi-cpu"><span class="kpi-label">Cluster CPU</span><span class="kpi-value"><strong>—</strong><span>%</span></span><svg class="kpi-spark accent" viewBox="0 0 96 18" aria-hidden="true"><polyline points=""/></svg></div>
        <div class="kpi" id="kpi-mem"><span class="kpi-label">Memory</span><span class="kpi-value"><strong>—</strong><span></span></span><svg class="kpi-spark accent" viewBox="0 0 96 18" aria-hidden="true"><polyline points=""/></svg></div>
        <div class="kpi" id="kpi-nodes"><span class="kpi-label">Nodes</span><span class="kpi-value"><strong>—</strong><span>online</span></span><svg class="kpi-spark" viewBox="0 0 96 18" aria-hidden="true"><polyline points=""/></svg></div>
      </section>

      <!-- Nodes -->
      <section class="section" id="nodes-section" aria-labelledby="nodes-heading">
        <div class="section-head">
          <h2 id="nodes-heading">Nodes</h2>
        </div>
        <div class="node-list" id="nodes-grid">
          <div class="node-row" aria-hidden="true"><div class="skeleton" style="width:140px;height:14px"></div></div>
        </div>
      </section>

      <!-- Applications -->
      <section class="section" aria-labelledby="apps-heading">
        <div class="section-head" id="apps-section">
          <h2 id="apps-heading">Applications</h2>
          <div class="segmented apps-filter" role="group" aria-label="Filter applications" id="apps-filter">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="web" aria-pressed="false">Web</button>
            <button type="button" data-filter="static" aria-pressed="false">Static</button>
            <button type="button" data-filter="worker" aria-pressed="false">Workers</button>
          </div>
        </div>
        <div class="apps-table-wrap" id="apps-grid">
          <div class="skeleton" style="width:100%;height:44px;margin-top:8px"></div>
        </div>
      </section>

    </div>
  </main>

</div>

<div id="toast-container"></div>

<script type="module">
  import { api } from './js/api.js';
  import { initDashboard } from './js/dashboard.js';
  import { initSidebar } from './js/sidebar.js';
  import './js/nodes.js';

  // Guard: redirect to login if not authenticated
  try {
    await api.checkAuth();
  } catch {
    location.href = '/login';
  }

  await initSidebar();
  initDashboard();

</script>
</body>
</html>
