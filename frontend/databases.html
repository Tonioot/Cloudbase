<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudbase — Databases</title>
  <link rel="icon" type="image/png" href="/cloudbase.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/overview.css" />
</head>
<body>

<div class="shell">

  <aside class="rail" id="rail"></aside>

  <main class="main-content">
    <div class="page">

      <div class="page-title-row">
        <h1>Databases</h1>
        <span class="page-title-meta">The managed databases and the node each one lives on</span>
        <div class="page-title-actions"><button class="btn btn-primary" id="btn-new-database" data-perm="databases.create"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> New database</button></div>
      </div>

      <section class="section section--page" id="databases-section" aria-labelledby="databases-heading" data-perm="databases.view">
        <div class="section-head">
          <h2 id="databases-heading">Databases</h2>
        </div>
        <div class="apps-table-wrap" id="databases-grid">
          <div class="skeleton" style="width:100%;height:44px;margin-top:8px"></div>
        </div>
      </section>

    </div>
  </main>

</div>

<div id="toast-container"></div>

<script type="module">
  import { api } from './js/api.js';
  import { initDashboard, drawDashboardFromCache } from './js/dashboard.js';
  import { initSidebar } from './js/sidebar.js';

  drawDashboardFromCache();
  try {
    await api.checkAuth();
  } catch {
    location.href = '/login';
  }
  await initSidebar();
  initDashboard();
</script>
</body>
</html>
