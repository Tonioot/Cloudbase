<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudbase — Databases</title>
  <link rel="icon" type="image/png" href="/cloudbase.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/overview.css" />
</head>
<body>

<div class="shell">

  <aside class="rail" id="rail"></aside>

  <!-- ─── Main ─────────────────────────────────────────────────────────── -->
  <main class="main-content">
    <div class="page">

      <div class="page-title-row">
        <h1>Databases</h1>
        <span class="page-title-meta">Each database runs on one fixed node with its own data volume</span>
        <div class="page-title-actions">
          <button class="btn btn-primary" id="btn-new-database" data-perm="databases.create">New database</button>
        </div>
      </div>

      <div id="databases-wrap"><div class="apps-empty">Loading…</div></div>

    </div>
  </main>

</div>

<div id="toast-container"></div>

<script type="module">
  import { api } from './js/api.js';
  import { initDatabasesPage } from './js/databases.js';
  import { initSidebar } from './js/sidebar.js';

  try {
    await api.checkAuth();
  } catch {
    location.href = '/login';
  }

  await initSidebar();
  initDatabasesPage();

</script>
</body>
</html>
