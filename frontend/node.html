<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node — Cloudbase</title>
  <link rel="icon" type="image/png" href="/cloudbase.png" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/detail.css" />
  <link rel="stylesheet" href="css/node.css" />
</head>
<body>

<div class="shell">

  <aside class="rail" id="rail"></aside>

  <!-- ─── Main ─────────────────────────────────────────────────────────── -->
  <main class="main-content">
    <div class="page page--detail">

    <!-- Header -->
    <section class="detail-head" aria-label="Node">
      <div class="detail-status-line">
        <span id="node-status-badge"></span>
        <span class="detail-status-meta" id="node-meta">—</span>
      </div>
      <div class="detail-head-row">
        <div class="detail-head-id">
          <div class="detail-title-row">
            <h1 class="detail-name" id="node-name">Loading…</h1>
          </div>
        </div>
        <div class="detail-actions">
          <button class="btn" id="btn-docker-cleanup" title="Remove old Docker images and trim the build cache">Clean up Docker</button>
          <button class="btn" id="btn-rename" data-perm="nodes.configure">Rename</button>
          <button class="btn" id="btn-toggle-enable" data-perm="nodes.configure">Disable</button>
          <button class="btn btn-danger" id="btn-delete" data-perm="nodes.delete">Remove</button>
        </div>
      </div>
    </section>

    <!-- At a glance: the same key numbers as the overview, no box around them -->
    <section class="kpis" aria-label="At a glance">
      <div class="kpi" id="tile-cpu">
        <span class="kpi-label">CPU</span>
        <span class="kpi-value"><strong>—</strong><span>%</span></span>
        <svg class="kpi-spark accent" viewBox="0 0 96 18" aria-hidden="true"><polyline points=""/></svg>
        <span class="kpi-sub">&nbsp;</span>
      </div>
      <div class="kpi" id="tile-mem">
        <span class="kpi-label">Memory</span>
        <span class="kpi-value"><strong>—</strong><span>%</span></span>
        <svg class="kpi-spark accent" viewBox="0 0 96 18" aria-hidden="true"><polyline points=""/></svg>
        <span class="kpi-sub">&nbsp;</span>
      </div>
      <div class="kpi" id="tile-disk">
        <span class="kpi-label">Disk</span>
        <span class="kpi-value"><strong>—</strong><span>%</span></span>
        <svg class="kpi-spark" viewBox="0 0 96 18" aria-hidden="true"><polyline points=""/></svg>
        <span class="kpi-sub">&nbsp;</span>
      </div>
      <div class="kpi" id="tile-net">
        <span class="kpi-label">Connection</span>
        <span class="kpi-value kpi-value--text"><strong>—</strong></span>
        <span class="kpi-sub">&nbsp;</span>
        <span class="kpi-sub faint">&nbsp;</span>
      </div>
    </section>

    <!-- What runs here -->
    <section class="section" aria-label="Running on this node">
      <div class="section-head">
        <h2>Running here</h2>
        <span class="section-note" id="run-count"></span>
      </div>
      <div class="nd-run-wrap scroll-list" id="run-list"></div>
    </section>

    <!-- Metrics over time -->
    <section class="section" aria-label="Metrics">
      <div class="section-head">
        <h2>Metrics</h2>
        <div class="segmented" role="group" aria-label="Chart range" id="node-range">
          <button type="button" data-hours="1" aria-pressed="true">1h</button>
          <button type="button" data-hours="24" aria-pressed="false">24h</button>
          <button type="button" data-hours="168" aria-pressed="false">7d</button>
        </div>
      </div>
      <div class="nd-charts" id="nd-charts"></div>
    </section>

    <!-- About this server -->
    <section class="section" aria-label="About this server">
      <div class="section-head"><h2>This server</h2></div>
      <div class="node-details-grid" id="node-info-grid"></div>
    </section>

    <!-- Activity -->
    <section class="section" aria-label="Agent log and commands">
      <div class="section-head">
        <div class="segmented" role="tablist" id="nd-tabs">
          <button type="button" role="tab" data-tab="log" aria-pressed="true">Agent log</button>
          <button type="button" role="tab" data-tab="commands" aria-pressed="false">Commands</button>
        </div>
        <button class="btn btn-sm nd-refresh" id="btn-refresh-logs">Refresh</button>
      </div>
      <div id="tab-log" class="node-log-frame">
        <pre id="node-logs-content" class="node-log-view"></pre>
        <div id="node-logs-empty" class="chart-offline-overlay" style="display:none"></div>
      </div>
      <div id="tab-commands" class="node-log-frame" hidden>
        <div id="node-history-list" class="node-log-view cmd-list"></div>
        <div id="node-history-empty" class="chart-offline-overlay" style="display:none"></div>
      </div>
    </section>

    </div>
  </main>
</div>

<div id="toast-container"></div>

<script type="module">
  import { api } from './js/api.js';
  import { initNodePage, drawNodeFromCache } from './js/node_detail.js';
  import { initSidebar } from './js/sidebar.js';

  drawNodeFromCache();

  try {
    await api.checkAuth();
  } catch {
    location.href = '/login';
  }

  await initSidebar();
  initNodePage();

</script>
</body>
</html>
