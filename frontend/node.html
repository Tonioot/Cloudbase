<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node — Cloudbase</title>
  <link rel="icon" type="image/png" href="/cloudbase.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/detail.css" />
</head>
<body>

<div class="shell">

  <aside class="rail" id="rail"></aside>

  <!-- ─── Main ─────────────────────────────────────────────────────────── -->
  <main class="main-content">
    <div class="page page--detail">

    <!-- Header -->
    <section class="detail-head" aria-label="Node">
      <div class="detail-status-line">
        <span id="node-status-badge"></span>
        <button type="button" id="node-ping-badge" class="pill" style="display:none" title="Click to ping again">
          <span id="node-ping-val">—</span>
        </button>
      </div>
      <div class="detail-head-row">
        <div class="detail-head-id">
          <div class="detail-title-row">
            <h1 class="detail-name" id="node-name">Loading…</h1>
          </div>
          <div class="detail-links"><span class="detail-repo" id="node-meta">—</span></div>
        </div>
        <div class="detail-actions">
          <button class="btn" id="btn-rename" data-perm="nodes.configure">Rename</button>
          <button class="btn" id="btn-toggle-enable" data-perm="nodes.configure">Enable</button>
          <button class="btn btn-danger" id="btn-delete" data-perm="nodes.delete">Remove</button>
        </div>
      </div>
    </section>

    <!-- Resources -->
    <section class="section" aria-label="Resources" style="border-top:1px solid var(--line)">
      <div class="section-head">
        <h2>Resources</h2>
        <div class="segmented" role="group" aria-label="Chart range" id="node-range">
          <button type="button" data-hours="1" aria-pressed="true">1h</button>
          <button type="button" data-hours="24" aria-pressed="false">24h</button>
          <button type="button" data-hours="168" aria-pressed="false">7d</button>
        </div>
      </div>
      <div class="stats-layout">
        <div class="card node-overview-panel">
          <div class="node-summary-grid">
            <div class="node-summary-card"><span class="node-summary-label">CPU</span><span class="node-summary-value" id="n-cpu">—</span></div>
            <div class="node-summary-card"><span class="node-summary-label">Memory</span><span class="node-summary-value" id="n-mem">—</span></div>
            <div class="node-summary-card"><span class="node-summary-label">Disk</span><span class="node-summary-value" id="n-disk">—</span></div>
          </div>
          <div class="node-details-grid" id="node-info-grid"></div>
        </div>
        <div class="node-chart-stack">
          <div class="card chart-card">
            <div class="chart-hdr"><div><div class="chart-title">CPU</div><div class="chart-subtitle node-range-label">Last hour · live</div></div><span class="chart-badge">%</span></div>
            <canvas id="node-chart-cpu" style="width:100%;height:110px;display:block"></canvas>
            <div id="node-chart-cpu-empty" class="chart-offline-overlay" style="display:none"></div>
          </div>
          <div class="card chart-card">
            <div class="chart-hdr"><div><div class="chart-title">Memory</div><div class="chart-subtitle node-range-label">Last hour · live</div></div><span class="chart-badge">%</span></div>
            <canvas id="node-chart-mem" style="width:100%;height:110px;display:block"></canvas>
            <div id="node-chart-mem-empty" class="chart-offline-overlay" style="display:none"></div>
          </div>
          <div class="card chart-card">
            <div class="chart-hdr"><div><div class="chart-title">Disk</div><div class="chart-subtitle node-range-label">Last hour · live</div></div><span class="chart-badge">%</span></div>
            <canvas id="node-chart-disk" style="width:100%;height:110px;display:block"></canvas>
            <div id="node-chart-disk-empty" class="chart-offline-overlay" style="display:none"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Logs & commands -->
    <section class="section node-bottom" aria-label="Agent logs and command history">
      <div class="node-panel">
        <div class="section-head">
          <h2>Agent logs</h2>
          <button class="btn btn-sm" id="btn-refresh-logs">Refresh</button>
        </div>
        <div class="node-log-frame">
          <pre id="node-logs-content" class="node-log-view"></pre>
          <div id="node-logs-empty" class="chart-offline-overlay" style="display:none"></div>
        </div>
      </div>
      <div class="node-panel">
        <div class="section-head"><h2>Command history</h2></div>
        <div id="node-history-list" class="cmd-list"></div>
      </div>
    </section>

    </div>
  </main>
</div>

<div id="toast-container"></div>

<script type="module">
  import { api } from './js/api.js';
  import { initNodePage } from './js/node_detail.js';
  import { initSidebar } from './js/sidebar.js';

  try {
    await api.checkAuth();
  } catch {
    location.href = '/login';
  }

  await initSidebar();
  initNodePage();

</script>
</body>
</html>
